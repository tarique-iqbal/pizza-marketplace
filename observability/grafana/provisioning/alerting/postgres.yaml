apiVersion: 1

groups:
  - orgId: 1
    name: postgres
    folder: Pizza Marketplace
    interval: 1m
    rules:
      - uid: postgres-down
        title: Database unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: pg_up{job="postgres"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: Alerting
        execErrState: Error
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.instance }} database is unreachable'
