global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: postgres
    metrics_path: /probe
    params:
      auth_module: [dev]
    static_configs:
      - targets:
          - postgres-identity:5432/identity_db
          - postgres-restaurant:5432/restaurant_db
          - postgres-order:5432/order_db
          - postgres-payment:5432/payment_db
          - postgres-customer:5432/customer_db
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__address__]
        regex: postgres-([a-z]+):.*
        target_label: instance
      - target_label: __address__
        replacement: postgres-exporter:9187
