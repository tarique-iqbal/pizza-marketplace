name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_identity:
        description: Run identity-service tests
        type: boolean
        default: false
      run_restaurant:
        description: Run restaurant-service tests
        type: boolean
        default: false
      run_notification:
        description: Run notification-service tests
        type: boolean
        default: false
      run_search:
        description: Run search-service tests
        type: boolean
        default: false
      run_order:
        description: Run order-service tests
        type: boolean
        default: false

jobs:
  detect-changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      identity: ${{ steps.filter.outputs.identity }}
      restaurant: ${{ steps.filter.outputs.restaurant }}
      notification: ${{ steps.filter.outputs.notification }}
      search: ${{ steps.filter.outputs.search }}
      order: ${{ steps.filter.outputs.order }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            identity:
              - 'identity-service/**'
              - 'compose.yaml'
              - 'compose.test.yaml'
            restaurant:
              - 'restaurant-service/**'
              - 'compose.yaml'
              - 'compose.test.yaml'
            notification:
              - 'notification-service/**'
              - 'compose.yaml'
            search:
              - 'search-service/**'
              - 'compose.yaml'
              - 'compose.test.yaml'
            order:
              - 'order-service/**'
              - 'compose.yaml'
              - 'compose.test.yaml'

  identity-ci:
    needs: detect-changes
    if: |
      always() &&
      (needs.detect-changes.outputs.identity == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_identity))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: identity-service/go.mod

      - name: Check formatting
        run: |
          cd identity-service
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: cd identity-service && go vet ./...

      - name: Write .env.test
        run: |
          cat > identity-service/.env.test <<'EOF'
          APP_ENV=test
          POSTGRES_USER=user_test
          POSTGRES_PASSWORD=pass_test
          POSTGRES_DB=identity_db_test
          POSTGRES_HOST=pg-identity-test
          POSTGRES_PORT=5432
          JWT_SECRET=test-secret
          REDIS_ADDR=redis-test:6379
          RABBITMQ_URL=amqp://user_test:pass_test@rabbitmq-test:5672/
          EOF

      - name: Start test stack
        run: docker compose -f compose.test.yaml --profile test up -d identity-test

      - name: Run migrations
        run: docker compose -f compose.test.yaml --profile test up migrate-identity-test

      - name: Run tests
        run: docker compose -f compose.test.yaml exec -T identity-test sh -c "cd /app && go test -p 1 -count=1 ./tests/..."

      - name: Tear down
        if: always()
        run: docker compose -f compose.test.yaml down -v

  restaurant-ci:
    needs: detect-changes
    if: |
      always() &&
      (needs.detect-changes.outputs.restaurant == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_restaurant))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: restaurant-service/go.mod

      - name: Check formatting
        run: |
          cd restaurant-service
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: cd restaurant-service && go vet ./...

      - name: Write .env.test
        run: |
          cat > restaurant-service/.env.test <<'EOF'
          APP_ENV=test
          LOG_LEVEL=info
          POSTGRES_USER=user_test
          POSTGRES_PASSWORD=pass_test
          POSTGRES_DB=restaurant_db_test
          POSTGRES_HOST=pg-restaurant-test
          POSTGRES_PORT=5432
          JWT_SECRET=test-secret
          RABBITMQ_URL=amqp://user_test:pass_test@rabbitmq-test:5672/
          OPENCAGE_API_KEY=test-key
          EOF

      - name: Start test stack
        run: docker compose -f compose.test.yaml --profile test up -d restaurant-test

      - name: Run migrations
        run: docker compose -f compose.test.yaml --profile test up migrate-restaurant-test

      - name: Run tests
        run: docker compose -f compose.test.yaml exec -T restaurant-test sh -c "cd /app && go test -p 1 -count=1 ./tests/..."

      - name: Tear down
        if: always()
        run: docker compose -f compose.test.yaml down -v

  notification-ci:
    needs: detect-changes
    if: |
      always() &&
      (needs.detect-changes.outputs.notification == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_notification))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: notification-service/go.mod

      - name: Check formatting
        run: |
          cd notification-service
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: cd notification-service && go vet ./...

      - name: Run tests
        run: cd notification-service && go test ./tests/...

  search-ci:
    needs: detect-changes
    if: |
      always() &&
      (needs.detect-changes.outputs.search == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_search))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: search-service/go.mod

      - name: Check formatting
        run: |
          cd search-service
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: cd search-service && go vet ./...

      - name: Write .env.test
        run: |
          cat > search-service/.env.test <<'EOF'
          APP_ENV=test
          LOG_LEVEL=info
          RABBITMQ_URL=amqp://user_test:pass_test@rabbitmq-test:5672/
          ELASTICSEARCH_URL=http://elasticsearch-test:9200
          OPENCAGE_API_KEY=test-key
          EOF

      - name: Start test stack
        run: docker compose -f compose.test.yaml --profile test up -d search-test

      - name: Run tests
        run: docker compose -f compose.test.yaml exec -T search-test sh -c "cd /app && go test -p 1 -count=1 ./tests/..."

      - name: Tear down
        if: always()
        run: docker compose -f compose.test.yaml down -v

  order-ci:
    needs: detect-changes
    if: |
      always() &&
      (needs.detect-changes.outputs.order == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_order))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: order-service/go.mod

      - name: Check formatting
        run: |
          cd order-service
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: cd order-service && go vet ./...

      - name: Write .env.test
        run: |
          cat > order-service/.env.test <<'EOF'
          APP_ENV=test
          LOG_LEVEL=info
          POSTGRES_USER=user_test
          POSTGRES_PASSWORD=pass_test
          POSTGRES_DB=order_db_test
          POSTGRES_HOST=pg-order-test
          POSTGRES_PORT=5432
          RABBITMQ_URL=amqp://user_test:pass_test@rabbitmq-test:5672/
          EOF

      - name: Start test stack
        run: docker compose -f compose.test.yaml --profile test up -d order-test

      - name: Run migrations
        run: docker compose -f compose.test.yaml --profile test up migrate-order-test

      - name: Run tests
        run: docker compose -f compose.test.yaml exec -T order-test sh -c "cd /app && go test -p 1 -count=1 ./tests/..."

      - name: Tear down
        if: always()
        run: docker compose -f compose.test.yaml down -v
