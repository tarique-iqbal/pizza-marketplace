services:
  pg-restaurant-test:
    image: postgres:17-alpine
    container_name: pizza-pg-restaurant-test
    environment:
      POSTGRES_USER: user_test
      POSTGRES_PASSWORD: pass_test
      POSTGRES_DB: restaurant_db_test
    volumes:
      - pg_restaurant_data_test:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_test -d restaurant_db_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["restaurant-test", "test"]

  migrate-restaurant-test:
    image: migrate/migrate
    depends_on:
      pg-restaurant-test:
        condition: service_healthy
    volumes:
      - ../restaurant-service/internal/infrastructure/migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgres://user_test:pass_test@pg-restaurant-test:5432/restaurant_db_test?sslmode=disable",
        "up"
      ]
    profiles: ["restaurant-test", "test"]

  restaurant-test:
    build:
      context: ..
      dockerfile: restaurant-service/Dockerfile
      target: dev
    container_name: pizza-restaurant-test
    env_file: ../restaurant-service/.env.test
    volumes:
      - ../restaurant-service:/app
    depends_on:
      pg-restaurant-test:      { condition: service_healthy }
      rabbitmq-test:           { condition: service_healthy }
      migrate-restaurant-test: { condition: service_completed_successfully }
    profiles: ["restaurant-test", "test"]

volumes:
  pg_restaurant_data_test:
