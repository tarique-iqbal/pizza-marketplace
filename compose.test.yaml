services:
  pg-identity-test:
    image: postgres:17-alpine
    container_name: pizza-pg-identity-test
    environment:
      POSTGRES_USER: user_test
      POSTGRES_PASSWORD: pass_test
      POSTGRES_DB: identity_db_test
    volumes:
      - pg_identity_data_test:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_test -d identity_db_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  pg-restaurant-test:
    image: postgres:17-alpine
    container_name: pizza-pg-restaurant-test
    environment:
      POSTGRES_USER: user_test
      POSTGRES_PASSWORD: pass_test
      POSTGRES_DB: restaurant_db_test
    volumes:
      - pg_restaurant_data_test:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_test -d restaurant_db_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  pg-order-test:
    image: postgres:17-alpine
    container_name: pizza-pg-order-test
    environment:
      POSTGRES_USER: user_test
      POSTGRES_PASSWORD: pass_test
      POSTGRES_DB: order_db_test
    volumes:
      - pg_order_data_test:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_test -d order_db_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate-identity-test:
    image: migrate/migrate
    depends_on:
      pg-identity-test:
        condition: service_healthy
    volumes:
      - ./identity-service/internal/infrastructure/migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgres://user_test:pass_test@pg-identity-test:5432/identity_db_test?sslmode=disable",
        "up"
      ]
    profiles: ["test"]

  migrate-restaurant-test:
    image: migrate/migrate
    depends_on:
      pg-restaurant-test:
        condition: service_healthy
    volumes:
      - ./restaurant-service/internal/infrastructure/migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgres://user_test:pass_test@pg-restaurant-test:5432/restaurant_db_test?sslmode=disable",
        "up"
      ]
    profiles: ["test"]

  migrate-order-test:
    image: migrate/migrate
    depends_on:
      pg-order-test:
        condition: service_healthy
    volumes:
      - ./order-service/internal/infrastructure/migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgres://user_test:pass_test@pg-order-test:5432/order_db_test?sslmode=disable",
        "up"
      ]
    profiles: ["test"]

  redis-test:
    image: redis:7-alpine
    container_name: pizza-redis-test
    ports:
      - "6380:6379"
    volumes:
      - redis_data_test:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  rabbitmq-test:
    image: rabbitmq:3-management-alpine
    container_name: pizza-rabbitmq-test
    environment:
      RABBITMQ_DEFAULT_USER: user_test
      RABBITMQ_DEFAULT_PASS: pass_test
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s

  elasticsearch-test:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: pizza-elasticsearch-test
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 5

  identity-test:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
      target: dev
    container_name: pizza-identity-test
    env_file: identity-service/.env.test
    volumes:
      - ./identity-service:/app
    depends_on:
      pg-identity-test:      { condition: service_healthy }
      redis-test:            { condition: service_healthy }
      rabbitmq-test:         { condition: service_healthy }
      migrate-identity-test: { condition: service_completed_successfully }
    profiles: ["test"]

  restaurant-test:
    build:
      context: .
      dockerfile: restaurant-service/Dockerfile
      target: dev
    container_name: pizza-restaurant-test
    env_file: restaurant-service/.env.test
    volumes:
      - ./restaurant-service:/app
    depends_on:
      pg-restaurant-test:      { condition: service_healthy }
      rabbitmq-test:           { condition: service_healthy }
      migrate-restaurant-test: { condition: service_completed_successfully }
    profiles: ["test"]

  search-test:
    build:
      context: .
      dockerfile: search-service/Dockerfile
      target: dev
    container_name: pizza-search-test
    env_file: search-service/.env.test
    volumes:
      - ./search-service:/app
    depends_on:
      elasticsearch-test: { condition: service_healthy }
      rabbitmq-test:      { condition: service_healthy }
    profiles: ["test"]

  order-test:
    build:
      context: .
      dockerfile: order-service/Dockerfile
      target: dev
    container_name: pizza-order-test
    env_file: order-service/.env.test
    volumes:
      - ./order-service:/app
    depends_on:
      pg-order-test:      { condition: service_healthy }
      rabbitmq-test:      { condition: service_healthy }
      migrate-order-test: { condition: service_completed_successfully }
    profiles: ["test"]

volumes:
  pg_identity_data_test:
  pg_restaurant_data_test:
  pg_order_data_test:
  redis_data_test:
